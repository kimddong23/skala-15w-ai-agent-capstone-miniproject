# 최소 보안 헤더. location 안에서 add_header 를 하나라도 쓰면 server 수준 헤더가 상속되지 않으므로, 각 location 이 이 파일을 include 한다.
# 화면은 인라인 style 속성(React)을 쓰므로 style-src 에 'unsafe-inline' 이 필요하고, 폰트·아이콘은 모두 번들이라 외부 출처가 없다.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
